name: validate

on:
  push:
  pull_request:

jobs:
  core-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]" -r skills/compare-mix-references/scripts/requirements.txt
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate schemas and runtime snapshot
        run: python scripts/validate_runtime.py
