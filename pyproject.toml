[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mix-analyzer"
version = "0.1.0"
description = "Reference analysis and evidence-driven mix prescription engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "PyYAML>=6.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
